<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rolex Watch Home</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#fff;color:#0f172a;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
ul{list-style:none}
img{max-width:100%;display:block}
.container{max-width:1280px;margin:0 auto;padding:0 1rem}

/* ===== HEADER ===== */
.main-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#0f172a}
.main-header-placeholder{height:110px}
@media(max-width:767px){.main-header-placeholder{height:96px}}
.nav-bar{border-bottom:1px solid rgba(255,255,255,.1)}
.nav-bar .container{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:.75rem;text-decoration:none}
.logo-icon1{width:40px;height:40px;object-fit:contain}
.logo-text{display:flex;flex-direction:column}
.logo-main{color:#fff;font-size:1.25rem;font-weight:700;letter-spacing:.05em}
.logo-sub{color:#94a3b8;font-size:.625rem;letter-spacing:.15em;text-transform:uppercase}
.nav-links{display:flex;align-items:center;gap:2rem}
@media(max-width:767px){.nav-links{display:none}}
.nav-link{color:#94a3b8;font-size:.875rem;font-weight:500;transition:color .2s;padding:.5rem 0}
.nav-link:hover,.nav-link.active{color:#fff}
.user-actions{display:flex;align-items:center;gap:1rem}
.login-btn{display:inline-flex;align-items:center;gap:.5rem;color:#fff;background:transparent;font-size:.875rem;font-weight:500;padding:.5rem 1rem;border:1px solid rgba(255,255,255,.2);border-radius:.25rem;transition:all .2s}
.login-btn:hover{background:rgba(255,255,255,.1)}
.login-btn svg{width:18px;height:18px}
.mobile-menu-btn{display:none;background:transparent;color:#fff;padding:.25rem}
@media(max-width:767px){.mobile-menu-btn{display:flex;align-items:center}}

/* Announcement Bar */
.announcement-bar{background:#0f172a;border-bottom:1px solid rgba(255,255,255,.05);padding:.5rem 0}
.announcement-content{display:flex;align-items:center;justify-content:center;gap:.75rem;color:#94a3b8;font-size:.8rem}
.announcement-content svg{width:16px;height:16px;color:#f59e0b;flex-shrink:0}
.announcement-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== HERO CAROUSEL ===== */
.hero-carousel-section{background:#0f172a;width:100%;position:relative;overflow:hidden}
.hero-carousel-container{width:100%;position:relative}
.hero-carousel-content{overflow:hidden}
.hero-carousel-slides{display:flex;transition:transform .5s ease-in-out;will-change:transform}
.hero-carousel-slide{flex:0 0 100%;width:100%;min-width:0;height:500px;position:relative}
@media(min-width:768px){.hero-carousel-slide{height:600px}}
.hero-carousel-slide-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-carousel-slide-overlay{position:absolute;inset:0;background-color:rgba(0,0,0,.4);background-image:linear-gradient(transparent 0%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.8) 100%)}
.hero-carousel-slide-content{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;max-width:1280px;height:100%;margin:0 auto;padding:4rem 1rem 0;position:relative}
.hero-carousel-slide-inner{display:flex;flex-direction:column;gap:1.5rem;max-width:42rem}
.hero-carousel-badge-container{display:flex;align-items:center;gap:1rem}
.hero-carousel-badge{color:#fff;text-transform:uppercase;letter-spacing:.05em;backdrop-filter:blur(4px);background-color:rgba(245,158,11,.9);border-radius:.125rem;padding:.25rem .75rem;font-size:.75rem;font-weight:700}
.hero-carousel-divider{background-color:rgba(255,255,255,.4);width:5rem;height:1px}
.hero-carousel-title{color:#fff;letter-spacing:-.025em;font-size:2.25rem;font-weight:700;line-height:1.1}
@media(min-width:768px){.hero-carousel-title{font-size:3.75rem}}
.hero-carousel-description{color:#e2e8f0;max-width:32rem;font-size:1.125rem;line-height:1.625}
@media(min-width:768px){.hero-carousel-description{font-size:1.25rem}}
.hero-carousel-button-container{padding-top:1rem}
.hero-carousel-button{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;white-space:nowrap;color:#0f172a;background:#fff;border:none;border-radius:0;height:2.5rem;padding:1.5rem 2rem;font-size:1rem;font-weight:500;transition:all .2s;cursor:pointer}
.hero-carousel-button:hover{background:#f1f5f9}
.hero-carousel-nav{display:none;justify-content:center;align-items:center;position:absolute;top:50%;transform:translateY(-50%);width:2.5rem;height:2.5rem;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;transition:all .2s;cursor:pointer}
@media(min-width:768px){.hero-carousel-nav{display:flex}}
.hero-carousel-nav:hover{background:rgba(255,255,255,.2)}
.hero-carousel-nav-prev{left:1rem}
.hero-carousel-nav-next{right:1rem}
.hero-carousel-nav svg{width:20px;height:20px}

/* ===== SERVICE CENTER ===== */
.service-center-section{background:#fff;padding:3rem 0}
.service-center-container{max-width:1280px;margin:0 auto;padding:0 1rem}
.service-center-header{text-align:center;margin-bottom:2.5rem}
.service-center-title{color:#0f172a;margin-bottom:.5rem;font-size:1.5rem;font-weight:700}
.service-center-subtitle{color:#64748b;font-size:.875rem}
.service-center-grid{display:grid;grid-template-columns:1fr;gap:1.5rem}
@media(min-width:768px){.service-center-grid{grid-template-columns:repeat(3,1fr)}}
.service-card{border:1px solid #f1f5f9;border-radius:.75rem;height:20rem;position:relative;overflow:hidden;transition:all .3s;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05)}
.service-card:hover{box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04)}
.service-card-recovery,.service-card-vault{display:flex;flex-direction:column}
.service-card-trade{text-align:center;background:#f8fafc;flex-direction:column;align-items:center;padding:2rem 1.5rem;display:flex;gap:.75rem}
.service-card-bg{position:absolute;inset:0}
.service-card-bg-vault{background-size:cover;background-position:center}
.service-card-image{width:100%;height:100%;object-fit:cover}
.service-card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.2) 100%)}
.service-card-overlay-vault{background:linear-gradient(to top,rgba(15,23,42,.9) 0%,rgba(15,23,42,.4) 100%)}
.service-card-content{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:1.5rem}
.service-card-info{margin-bottom:1rem}
.service-card-info svg{width:24px;height:24px;color:#f59e0b;margin-bottom:.5rem}
.service-card-title{color:#fff;font-size:1.25rem;font-weight:600;margin-bottom:.25rem}
.service-card-title-dark{color:#0f172a}
.service-card-description{color:#cbd5e1;font-size:.875rem}
.service-card-description-dark{color:#64748b}
.service-card-icon-wrapper{width:100%;height:8rem;border-radius:.5rem;overflow:hidden;margin-bottom:.5rem}
.service-card-icon{width:100%;height:100%;object-fit:cover}
.service-card-button{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:.375rem;font-size:.875rem;font-weight:500;transition:all .2s;cursor:pointer}
.service-card-button svg{width:16px;height:16px}
.service-card-button-amber{background:#f59e0b;color:#fff;border:none}
.service-card-button-amber:hover{background:#d97706}
.service-card-button-emerald{background:#10b981;color:#fff;border:none}
.service-card-button-emerald:hover{background:#059669}
.service-card-button-outline{background:transparent;color:#0f172a;border:1px solid #e2e8f0;padding:.5rem 1.5rem}
.service-card-button-outline:hover{background:#f1f5f9}

/* ===== FEATURED WATCHES ===== */
.featured-watches-section{background:#f8fafc;padding:3rem 0}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.section-title{color:#0f172a;font-size:1.5rem;font-weight:700}
.section-subtitle{color:#64748b;font-size:.875rem;margin-top:.25rem}
.view-more-btn{display:inline-flex;align-items:center;gap:.5rem;color:#0f172a;background:transparent;border:1px solid #e2e8f0;border-radius:.375rem;padding:.5rem 1rem;font-size:.875rem;font-weight:500;transition:all .2s;cursor:pointer}
.view-more-btn:hover{background:#f1f5f9}
.view-more-btn svg{width:16px;height:16px}
.watches-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem}
@media(min-width:768px){.watches-grid{grid-template-columns:repeat(4,1fr)}}
.watch-card{background:#fff;border-radius:.75rem;overflow:hidden;border:1px solid #f1f5f9;transition:all .3s;cursor:pointer}
.watch-card:hover{box-shadow:0 10px 15px -3px rgba(0,0,0,.1);transform:translateY(-2px)}
.watch-image-wrapper{position:relative;aspect-ratio:1;overflow:hidden;background:#f8fafc}
.watch-image{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.watch-card:hover .watch-image{transform:scale(1.05)}
.badge-wrapper{position:absolute;top:.75rem;left:.75rem}
.badge{background:#10b981;color:#fff;font-size:.7rem;font-weight:600;padding:.2rem .5rem;border-radius:.25rem}
.watch-name{color:#0f172a;font-size:.875rem;font-weight:600;padding:.75rem .75rem .25rem;line-height:1.4}
.watch-brand{color:#64748b;font-size:.75rem;padding:0 .75rem}
.watch-price{color:#0f172a;font-size:1rem;font-weight:700;padding:.5rem .75rem .75rem}

/* ===== RARE COLLECTIONS ===== */
.rare-collections-section{background:#fff;padding:3rem 0}
.badge-required{background:#fef3c7;color:#92400e;font-size:.75rem;font-weight:600;padding:.25rem .75rem;border-radius:9999px}
.collections-grid{display:grid;grid-template-columns:1fr;gap:1.5rem}
@media(min-width:768px){.collections-grid{grid-template-columns:repeat(2,1fr)}}
.collection-card{position:relative;border-radius:.75rem;overflow:hidden;height:16rem;cursor:pointer}
.collection-image{width:100%;height:100%;object-fit:cover}
.collection-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.75rem;text-align:center;padding:1rem;transition:background .3s}
.collection-card:hover .collection-overlay{background:rgba(0,0,0,.7)}
.collection-overlay svg{width:32px;height:32px;color:rgba(255,255,255,.6)}
.collection-name{color:#fff;font-size:1.25rem;font-weight:600}
.collection-description{color:#cbd5e1;font-size:.875rem}
.apply-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:.375rem;padding:.5rem 1.5rem;font-size:.875rem;transition:all .2s;cursor:pointer}
.apply-btn:hover{background:rgba(255,255,255,.1)}

/* ===== VIP MEMBER ===== */
.vip-member-section{background:#f8fafc;padding:3rem 0}
.membership-grid{display:grid;grid-template-columns:1fr;gap:1.5rem}
@media(min-width:768px){.membership-grid{grid-template-columns:repeat(3,1fr)}}
.membership-card{position:relative;border-radius:.75rem;padding:2rem 1.5rem;overflow:hidden;border:1px solid transparent;transition:all .3s}
.membership-card:hover{transform:translateY(-4px)}
.card-bg-icon{position:absolute;top:1rem;right:1rem;opacity:.1}
.card-bg-icon svg{width:64px;height:64px}
.card-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem}
.tier-badge{width:2.5rem;height:2.5rem;border-radius:.5rem;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.875rem}
.badge-silver{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#fff}
.badge-gold{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
.badge-diamond{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.tier-title{font-size:1.125rem;font-weight:600}
.title-silver{color:#64748b}
.title-gold{color:#b45309}
.title-diamond{color:#6366f1}
.tier-silver{background:linear-gradient(135deg,#f8fafc,#f1f5f9);border-color:#e2e8f0}
.tier-gold{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}
.tier-diamond{background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-color:#c7d2fe}
.benefits-list{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.5rem}
.benefit-item{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:#334155}
.benefit-item svg{width:16px;height:16px;color:#f59e0b;flex-shrink:0}
.benefit-item.locked{color:#94a3b8}
.benefit-item.locked svg{color:#94a3b8}
.action-btn{width:100%;padding:.75rem;border-radius:.5rem;font-size:.875rem;font-weight:600;transition:all .2s;cursor:pointer}
.btn-silver{background:#e2e8f0;color:#64748b;border:none}
.btn-silver:hover{background:#cbd5e1}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none}
.btn-gold:hover{opacity:.9}
.btn-diamond{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none}
.btn-diamond:hover{opacity:.9}

/* ===== APPOINTMENT ===== */
.appointment-section{background:#fff;padding:3rem 0}
.appointment-description{color:#334155;font-size:.875rem;line-height:1.75;margin-bottom:1.5rem}
.reward-list{display:flex;flex-direction:column;gap:.75rem}
.reward-item{display:flex;align-items:baseline;gap:.75rem;padding:1rem;background:#f8fafc;border-radius:.5rem;border:1px solid #f1f5f9}
.reward-number{color:#f59e0b;font-weight:700;font-size:1rem}
.reward-content{color:#334155;font-size:.875rem}

/* ===== MARKET INSIGHTS ===== */
.market-insights-section{background:#f8fafc;padding:3rem 0}
.read-more-btn{display:inline-flex;align-items:center;gap:.5rem;color:#0f172a;background:transparent;border:1px solid #e2e8f0;border-radius:.375rem;padding:.5rem 1rem;font-size:.875rem;font-weight:500;transition:all .2s;cursor:pointer}
.read-more-btn:hover{background:#f1f5f9}
.articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;min-height:100px}
.article-card{background:#fff;border-radius:.75rem;overflow:hidden;border:1px solid #f1f5f9;transition:all .3s;cursor:pointer}
.article-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}

/* ===== FOOTER ===== */
.main-footer{background:#0f172a;padding:3rem 0 2rem;color:#94a3b8}
.footer-content{display:grid;grid-template-columns:1fr;gap:2rem}
@media(min-width:768px){.footer-content{grid-template-columns:2fr 1fr 1fr 1fr}}
.footer-brand{max-width:20rem}
.brand-logo{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
.brand-logo svg{width:24px;height:24px;color:#f59e0b}
.brand-text{display:flex;flex-direction:column}
.brand-name{color:#fff;font-size:1.125rem;font-weight:700}
.brand-subtitle{color:#64748b;font-size:.625rem;letter-spacing:.1em;text-transform:uppercase}
.brand-description{color:#94a3b8;font-size:.875rem;line-height:1.625}
.column-title{color:#fff;font-size:.875rem;font-weight:600;margin-bottom:1rem}
.column-links{display:flex;flex-direction:column;gap:.5rem}
.link-item{color:#94a3b8;font-size:.875rem;transition:color .2s;cursor:pointer}
.link-item:hover{color:#fff}
.language-switcher{position:relative}
.language-current{display:flex;align-items:center;gap:.5rem;background:#1e293b;border:1px solid #334155;border-radius:.375rem;padding:.5rem .75rem;color:#94a3b8;font-size:.875rem;cursor:pointer;transition:all .2s}
.language-current:hover{border-color:#475569}
.language-icon{width:20px;height:20px;border-radius:50%}
.language-name{flex:1}
.dropdown-arrow{width:16px;height:16px}

/* ===== LOGIN DIALOG ===== */
.dialog-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:center}
.login-dialog{background:#fff;border-radius:.5rem;width:100%;max-width:420px;padding:2rem;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-dialog h3{color:#0f172a;font-size:1.25rem;font-weight:600;margin-bottom:1.5rem}
.login-dialog .close-btn{position:absolute;top:1rem;right:1rem;background:transparent;color:#94a3b8;font-size:1.25rem;padding:.25rem}
.login-dialog .close-btn:hover{color:#0f172a}
.form-group{margin-bottom:1rem}
.form-group label{display:block;color:#334155;font-size:.875rem;font-weight:500;margin-bottom:.375rem}
.form-group input{width:100%;padding:.625rem .75rem;border:1px solid #e2e8f0;border-radius:.375rem;font-size:.875rem;color:#0f172a;transition:border .2s;background:#fff}
.form-group input:focus{border-color:#3b82f6;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form-group input::placeholder{color:#94a3b8}
.code-row{display:flex;gap:.5rem}
.code-row input{flex:1}
.code-btn{background:#0f172a;color:#fff;padding:.625rem 1rem;border-radius:.375rem;font-size:.8rem;white-space:nowrap;transition:all .2s}
.code-btn:hover{background:#1e293b}
.code-btn:disabled{opacity:.5;cursor:not-allowed}
.login-submit{width:100%;padding:.75rem;background:#0f172a;color:#fff;border-radius:.375rem;font-size:1rem;font-weight:600;transition:all .2s;margin-top:.5rem}
.login-submit:hover{background:#1e293b}
.login-footer{text-align:center;margin-top:1rem;color:#64748b;font-size:.8rem}
.login-footer a{color:#3b82f6;cursor:pointer}
.login-footer a:hover{text-decoration:underline}

/* ===== CART DIALOG ===== */
.cart-dialog{position:fixed;z-index:1000;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #e5e7eb;border-radius:.5rem;width:100%;max-width:calc(100% - 2rem);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
@media(min-width:640px){.cart-dialog{max-width:600px}}
.dialog-header{display:flex;justify-content:space-between;align-items:center;padding:1.5rem;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.dialog-title{color:#0f172a;font-size:1.25rem;font-weight:600}
.cart-content{flex:1;overflow-y:auto;padding:1rem;min-height:200px}
.cart-item{display:flex;gap:1rem;padding:1rem;border-bottom:1px solid #f1f5f9}
.cart-item-img{width:80px;height:80px;border-radius:.5rem;object-fit:cover;background:#f8fafc}
.cart-item-info{flex:1}
.cart-item-name{color:#0f172a;font-size:.875rem;font-weight:600;margin-bottom:.25rem}
.cart-item-size{color:#64748b;font-size:.75rem;margin-bottom:.5rem}
.cart-item-price{color:#0f172a;font-weight:700}
.cart-qty{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.cart-qty button{width:28px;height:28px;border:1px solid #e2e8f0;border-radius:.25rem;background:#fff;color:#0f172a;font-size:1rem;display:flex;align-items:center;justify-content:center}
.cart-qty button:hover{background:#f1f5f9}
.cart-qty span{font-size:.875rem;min-width:1.5rem;text-align:center}
.cart-footer{padding:1rem 1.5rem;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.cart-total{font-size:1.125rem;font-weight:700;color:#0f172a}
.checkout-btn{background:#0f172a;color:#fff;padding:.75rem 2rem;border-radius:.375rem;font-weight:600;transition:all .2s}
.checkout-btn:hover{background:#1e293b}
.cart-empty{text-align:center;padding:3rem 1rem;color:#94a3b8}

/* ===== WATCH DETAIL DIALOG ===== */
.detail-dialog{position:fixed;z-index:1000;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:.75rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.detail-close{position:absolute;top:1rem;right:1rem;z-index:10;background:rgba(0,0,0,.5);color:#fff;width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
.detail-close:hover{background:rgba(0,0,0,.7)}
.detail-img{width:100%;aspect-ratio:1;object-fit:cover;background:#f8fafc}
.detail-body{padding:1.5rem}
.detail-body h2{color:#0f172a;font-size:1.25rem;font-weight:700;margin-bottom:.5rem}
.detail-body .desc{color:#64748b;font-size:.875rem;margin-bottom:1rem;line-height:1.5}
.detail-body .price{color:#0f172a;font-size:1.5rem;font-weight:700;margin-bottom:1rem}
.size-options{display:flex;gap:.5rem;margin-bottom:1.5rem}
.size-btn{padding:.5rem 1rem;border:1px solid #e2e8f0;border-radius:.375rem;font-size:.875rem;color:#334155;background:#fff;transition:all .2s}
.size-btn:hover{border-color:#94a3b8}
.size-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
.detail-actions{display:flex;gap:.75rem}

// ===== APP =====
const app = createApp({
  setup(){
    const lang = ref(localStorage.getItem('rlang')||'zh');
    const t = (key)=>msgs[lang.value]?.[key]||msgs['zh'][key]||key;
    const toggleLang = ()=>{lang.value=lang.value==='zh'?'en':'zh';localStorage.setItem('rlang',lang.value)};

    const route = useRoute();
    const routerInstance = useRouter();
    const currentPath = computed(()=>route.path);

    const watches = ref([...MOCK_WATCHES]);
    const cart = ref(JSON.parse(localStorage.getItem('rcart')||'[]'));
    const cartOpen = ref(false);
    const detailOpen = ref(false);
    const detailP = ref(null);
    const loginOpen = ref(false);
    const isLogged = ref(!!localStorage.getItem('ruser'));
    const userName = ref(localStorage.getItem('ruser')||'');
    const mobileMenuOpen = ref(false);
    const selectedSize = ref('41mm');

    watch(cart,(v)=>localStorage.setItem('rcart',JSON.stringify(v)),{deep:true});

    const cartTotal = computed(()=>cart.value.reduce((s,i)=>s+i.price*i.qty,0));

    const openDetail = (w)=>{detailP.value=w;detailOpen.value=true;selectedSize.value='41mm'};
    const closeDetail = ()=>{detailOpen.value=false};
    const openLogin = ()=>{loginOpen.value=true};
    const closeLogin = ()=>{loginOpen.value=false};

    const addToCart = (w)=>{
      const existing = cart.value.find(i=>i.id===w.id&&i.size===selectedSize.value);
      if(existing){existing.qty++}
      else{cart.value.push({id:w.id,title:w.title,price:w.price,img:w.img||w.thumbnail||'',size:selectedSize.value,qty:1})}
      toast(t('added'));
    };

    const doLogin = (phone)=>{
      if(!phone){toast('Please enter phone');return}
      userName.value=phone;isLogged.value=true;localStorage.setItem('ruser',phone);loginOpen.value=false;
      toast(t('login')+' OK');
    };
    const doLogout = ()=>{userName.value='';isLogged.value=false;localStorage.removeItem('ruser')};

    // Fetch from API
    onMounted(async()=>{
      try{
        const r=await fetch(API_BASE+'/products?limit=10&region_id='+REGION,{headers:{'x-publishable-api-key':API_KEY}});
        const d=await r.json();
        if(d.products&&d.products.length){
          watches.value=d.products.map(p=>({
            id:p.id,title:p.title,brand:p.subtitle||'',
            price:p.variants?.[0]?.prices?.[0]?.amount?p.variants[0].prices[0].amount/100:0,
            img:p.thumbnail||p.images?.[0]?.url||''
          }));
        }
      }catch(e){/* fallback to MOCK_WATCHES */}
    });

    provide('t',t);provide('lang',lang);provide('watches',watches);
    provide('openDetail',openDetail);provide('openLogin',openLogin);
    provide('isLogged',isLogged);provide('userName',userName);

    return {
      t,lang,toggleLang,currentPath,routerInstance,
      watches,cart,cartOpen,cartTotal,detailOpen,detailP,selectedSize,
      loginOpen,isLogged,userName,mobileMenuOpen,
      openDetail,closeDetail,addToCart,openLogin,closeLogin,doLogin,doLogout,fmtPrice
    };
  },
  template:`
  <div class="main-layout">
    <!-- Header -->
    <header class="main-header">
      <div class="nav-bar">
        <div class="container">
          <a href="#/" class="logo">
            <img src="./images/logo.png" alt="Rolex" class="logo-icon1">
            <div class="logo-text"><span class="logo-main">Rolex</span><span class="logo-sub">WATCH HOME</span></div>
          </a>
          <nav class="nav-links">
            <a href="#/" class="nav-link" :class="{active:currentPath==='/'}">{{t('home')}}</a>
            <a href="#/flash-sale" class="nav-link" :class="{active:currentPath==='/flash-sale'}">{{t('flashSale')}}</a>
            <a href="#/recycling" class="nav-link" :class="{active:currentPath==='/recycling'}">{{t('recycling')}}</a>
            <a href="#/logistics" class="nav-link" :class="{active:currentPath==='/logistics'}">{{t('logistics')}}</a>
            <a href="#/market-insight" class="nav-link" :class="{active:currentPath==='/market-insight'}">{{t('marketInsight')}}</a>
            <a href="#/account" class="nav-link" :class="{active:currentPath==='/account'}">{{t('account')}}</a>
          </nav>
          <div class="user-actions">
            <button class="login-btn" v-if="!isLogged" @click="loginOpen=true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              {{t('loginReg')}}
            </button>
            <button class="login-btn" v-else @click="cartOpen=true" style="position:relative">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
              {{t('cart')}} <span v-if="cart.length" style="background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;font-size:.7rem;display:inline-flex;align-items:center;justify-content:center">{{cart.length}}</span>
            </button>
            <button class="mobile-menu-btn" @click="mobileMenuOpen=true">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="announcement-bar">
        <div class="container">
          <div class="announcement-content">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
            <div class="announcement-text-wrapper"><span class="announcement-text">{{t('announcement')}}</span></div>
          </div>
        </div>
      </div>
    </header>
    <div class="main-header-placeholder"></div>

    <!-- Router View -->
    <router-view></router-view>

    <!-- Footer -->
    <footer class="main-footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-column footer-brand">
            <div class="brand-logo">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#f59e0b"><circle cx="12" cy="12" r="6"/><polyline points="12 10 12 12 13 13"/><path d="m16.13 7.66-.81-4.05a2 2 0 0 0-2-1.61h-2.68a2 2 0 0 0-2 1.61l-.78 4.05"/><path d="m7.88 16.36.8 4a2 2 0 0 0 2 1.61h2.72a2 2 0 0 0 2-1.61l.81-4.05"/></svg>
              <div class="brand-text"><span class="brand-name">Rolex</span><span class="brand-subtitle">WATCH HOME</span></div>
            </div>
            <p class="brand-description">{{t('footerDesc')}}</p>
          </div>
          <div class="footer-column">
            <h4 class="column-title">{{t('footerService')}}</h4>
            <ul class="column-links">
              <li><a href="#/flash-sale" class="link-item">{{t('flashSale')}}</a></li>
              <li><a href="#/recycling" class="link-item">{{t('recycling')}}</a></li>
              <li><a href="#/logistics" class="link-item">{{t('logisticsQuery')}}</a></li>
            </ul>
          </div>
          <div class="footer-column">
            <h4 class="column-title">{{t('footerAbout')}}</h4>
            <ul class="column-links">
              <li><a class="link-item">{{t('aboutCompany')}}</a></li>
              <li><a class="link-item">{{t('aboutTerms')}}</a></li>
              <li><a class="link-item">{{t('aboutJoin')}}</a></li>
              <li><a class="link-item">{{t('aboutPrivacy')}}</a></li>
            </ul>
          </div>
          <div class="footer-column footer-column-language">
            <h4 class="column-title">{{t('footerLang')}}</h4>
            <div class="language-switcher">
              <button class="language-current" @click="toggleLang">
                <span class="language-name">{{t('langName')}}</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropdown-arrow"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <!-- Mobile Menu -->
    <div v-if="mobileMenuOpen" class="mobile-nav-overlay" @click="mobileMenuOpen=false"></div>
    <nav class="mobile-nav" :class="{open:mobileMenuOpen}">
      <button class="close-menu" @click="mobileMenuOpen=false">&times;</button>
      <a href="#/" @click="mobileMenuOpen=false" :class="{active:currentPath==='/'}">{{t('home')}}</a>
      <a href="#/flash-sale" @click="mobileMenuOpen=false" :class="{active:currentPath==='/flash-sale'}">{{t('flashSale')}}</a>
      <a href="#/recycling" @click="mobileMenuOpen=false" :class="{active:currentPath==='/recycling'}">{{t('recycling')}}</a>
      <a href="#/logistics" @click="mobileMenuOpen=false" :class="{active:currentPath==='/logistics'}">{{t('logistics')}}</a>
      <a href="#/market-insight" @click="mobileMenuOpen=false" :class="{active:currentPath==='/market-insight'}">{{t('marketInsight')}}</a>
      <a href="#/account" @click="mobileMenuOpen=false" :class="{active:currentPath==='/account'}">{{t('account')}}</a>
      <a @click="mobileMenuOpen=false;loginOpen=true" v-if="!isLogged">{{t('loginReg')}}</a>
      <a @click="mobileMenuOpen=false;cartOpen=true" v-if="isLogged">{{t('cart')}} ({{cart.length}})</a>
    </nav>

    <!-- Login Dialog -->
    <div v-if="loginOpen" class="dialog-overlay" @click.self="closeLogin">
      <div class="login-dialog">
        <button class="close-btn" @click="closeLogin">&times;</button>
        <h3>{{t('login')}}</h3>
        <div class="form-group"><label>{{t('phone')}}</label><input id="login-phone" placeholder=""></div>
        <div class="form-group"><label>{{t('password')}}</label><input type="password" placeholder=""></div>
        <div class="form-group"><label>{{t('code')}}</label><div class="code-row"><input placeholder=""><button class="code-btn">{{t('getCode')}}</button></div></div>
        <button class="login-submit" @click="doLogin(document.getElementById('login-phone').value)">{{t('login')}}</button>
        <div class="login-footer">{{t('noAccount')}} <a @click="">{{t('register')}}</a> | <a @click="">{{t('forgotPwd')}}</a></div>
      </div>
    </div>

    <!-- Cart Dialog -->
    <div v-if="cartOpen" class="dialog-overlay" @click.self="cartOpen=false">
      <div class="cart-dialog">
        <div class="dialog-header"><span class="dialog-title">{{t('cart')}}</span><button class="close-btn" @click="cartOpen=false" style="position:static;font-size:1.25rem">&times;</button></div>
        <div class="cart-content">
          <div v-if="!cart.length" class="cart-empty">{{t('emptyCart')}}</div>
          <div v-for="(item,i) in cart" :key="i" class="cart-item">
            <img :src="item.img" class="cart-item-img">
            <div class="cart-item-info">
              <div class="cart-item-name">{{item.title}}</div>
              <div class="cart-item-size">{{item.size}}</div>
              <div class="cart-item-price">{{fmtPrice(item.price)}}</div>
              <div class="cart-qty">
                <button @click="item.qty>1?item.qty--:cart.splice(i,1)">-</button>
                <span>{{item.qty}}</span>
                <button @click="item.qty++">+</button>
              </div>
            </div>
          </div>
        </div>
        <div class="cart-footer" v-if="cart.length">
          <span class="cart-total">{{t('total')}}: {{fmtPrice(cartTotal)}}</span>
          <button class="checkout-btn">{{t('checkout')}}</button>
        </div>
      </div>
    </div>

    <!-- Watch Detail Dialog -->
    <div v-if="detailOpen&&detailP" class="dialog-overlay" @click.self="closeDetail">
      <div class="detail-dialog">
        <button class="detail-close" @click="closeDetail">&times;</button>
        <img :src="detailP.img||detailP.thumbnail||''" class="detail-img">
        <div class="detail-body">
          <h2>{{detailP.title}}</h2>
          <p class="desc">{{detailP.brand||''}}</p>
          <div class="price">{{fmtPrice(detailP.price)}}</div>
          <div class="size-options">
            <button v-for="s in ['36mm','39mm','41mm','44mm']" :key="s" class="size-btn" :class="{active:selectedSize===s}" @click="selectedSize=s">{{s}}</button>
          </div>
          <div class="detail-actions">
            <button class="add-cart-btn" @click="addToCart(detailP)">{{t('addCart')}}</button>
            <button class="buy-now-btn" @click="addToCart(detailP);cartOpen=true;closeDetail()">{{t('buyNow')}}</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lang Toggle -->
    <button class="lang-toggle" @click="toggleLang">{{lang==='zh'?'EN':'中文'}}</button>
  </div>
  `
});

app.use(router);
app.mount('#app');
</script>
</body>
</html>
