<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rolex 奢侈品腕表商城</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.1/dist/index.css">
  <style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#111214;--bg2:#0c0d0f;--gold:#c9a84c;--gold2:#d4b85e;--card:#1a1b1e;--bd:#2a2b2e;--t1:#fff;--t2:#888;--t3:#666;--t4:#94a3b8;--r:8px}
html,body{height:100%;font-family:'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
#app{min-height:100vh;padding-bottom:70px;max-width:480px;margin:0 auto;position:relative}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{cursor:pointer;border:none;outline:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:64px;background:var(--bg2);border-top:1px solid var(--bd);display:flex;z-index:999}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--t2);transition:.2s;cursor:pointer}
.tab-item.active{color:var(--gold)}
.tab-item .ti{font-size:22px}

.search-bar{padding:12px 16px;position:sticky;top:0;z-index:10;background:var(--bg)}
.search-wrap{display:flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 14px;gap:8px}
.search-wrap input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px}
.search-wrap input::placeholder{color:var(--t2)}
.search-wrap .si{color:var(--t2);font-size:16px}

.banner-section{padding:0 16px;margin-bottom:16px}
.banner-wrap{position:relative;overflow:hidden;border-radius:var(--r);height:180px}
.banner-track{display:flex;transition:transform .5s ease;height:100%}
.banner-slide{min-width:100%;height:100%}
.banner-slide img{width:100%;height:100%;object-fit:cover}
.banner-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.banner-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.2s}
.banner-dot.active{background:var(--gold);width:20px;border-radius:4px}

.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 16px;margin-bottom:20px}
.qa-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;background:var(--card);border-radius:var(--r);border:1px solid var(--bd);cursor:pointer;transition:.2s}
.qa-item:hover{border-color:var(--gold);transform:translateY(-2px)}
.qa-icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a8893a);display:flex;align-items:center;justify-content:center;font-size:20px}
.qa-label{font-size:12px;color:var(--t2)}

.sec-title{padding:0 16px;margin-bottom:14px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-title .bar{width:4px;height:20px;background:var(--gold);border-radius:2px}

.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
.p-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.25s}
.p-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 24px rgba(201,168,76,.12)}
.p-card .thumb{width:100%;aspect-ratio:1;background:#222;overflow:hidden;position:relative}
.p-card .thumb img{width:100%;height:100%;object-fit:cover;transition:.3s}
.p-card:hover .thumb img{transform:scale(1.05)}
.p-card .fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2;border:none;color:#fff;cursor:pointer}
.p-card .fav.on{color:var(--gold)}
.p-card .info{padding:10px}
.p-card .info .name{font-size:13px;color:#eee;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;min-height:36px}
.p-card .info .price{font-size:16px;font-weight:700;color:var(--gold)}
.p-card .info .price small{font-size:11px;font-weight:400}
.load-more{text-align:center;padding:20px 16px 30px}

.skel{background:linear-gradient(90deg,var(--card) 25%,#242528 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Detail */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.detail-panel{background:var(--bg);border:1px solid var(--bd);border-radius:12px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.detail-close{position:absolute;top:12px;right:12px;z-index:10;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.detail-img{width:100%;aspect-ratio:1;background:#1a1a1a;overflow:hidden}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-body{padding:16px}
.detail-body .dt{font-size:18px;font-weight:700;margin-bottom:8px}
.detail-body .dd{color:var(--t2);font-size:13px;line-height:1.6;margin-bottom:12px}
.detail-body .dp{font-size:24px;font-weight:700;color:var(--gold);margin-bottom:16px}
.size-opts{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.size-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-size:13px;cursor:pointer;transition:.2s}
.size-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.1)}
.detail-btns{display:flex;gap:10px}
.detail-btns button{flex:1;height:44px;border-radius:20px;font-size:15px;font-weight:600;border:none;cursor:pointer}
.btn-cart{background:var(--card);color:#fff;border:1px solid var(--bd)!important}
.btn-buy{background:var(--gold);color:#000}

/* Recycle */
.rc-item{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin:0 16px 10px;cursor:pointer;transition:.2s}
.rc-item:hover{border-color:var(--gold)}
.rc-left{display:flex;align-items:center;gap:12px;font-size:15px}
.rc-emoji{font-size:24px}
.rc-arrow{color:var(--t2);font-size:18px}
.est-btn{margin:6px 16px 20px}
.est-btn button{width:100%;height:50px;font-size:17px;border-radius:var(--r);font-weight:700;background:var(--gold);color:#000;border:none}
.sf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px;margin-bottom:24px}
.sf-item{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px 14px;text-align:center}
.sf-icon{font-size:28px;margin-bottom:8px}
.sf-label{font-size:14px;font-weight:600;margin-bottom:4px}
.sf-sub{font-size:11px;color:var(--t2)}
.flow-steps{display:flex;flex-direction:column;gap:14px;padding:0 16px 24px}
.flow-step{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r)}
.flow-num{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.step-t{font-size:14px;font-weight:600;margin-bottom:2px}
.step-d{font-size:12px;color:var(--t2)}

/* VIP */
.vip-card{margin:16px;padding:24px;background:linear-gradient(135deg,#1c1d20,#2a2520);border:1px solid var(--gold);border-radius:12px;position:relative;overflow:hidden}
.vip-card::before{content:'';position:absolute;top:-50%;right:-50%;width:100%;height:100%;background:radial-gradient(circle,rgba(201,168,76,.15),transparent);pointer-events:none}
.vip-level{font-size:22px;font-weight:700;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.vip-stats{display:flex;gap:16px;margin-bottom:16px}
.vs{text-align:center;flex:1}
.vs .vv{font-size:20px;font-weight:700;color:var(--gold)}
.vs .vl{font-size:11px;color:var(--t2);margin-top:2px}
.vip-prog{margin:0 16px 6px;height:10px;background:var(--bd);border-radius:10px;overflow:hidden}
.vip-prog-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:10px;transition:width .5s}
.vip-prog-text{text-align:center;font-size:12px;color:var(--t2);margin-bottom:16px}
.vb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px;margin-bottom:20px}
.vb-item{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 8px;text-align:center;transition:.2s}
.vb-item:hover{border-color:var(--gold)}
.vb-icon{font-size:28px;margin-bottom:6px}
.vb-name{font-size:12px;color:#ccc}
.invite-sec{padding:0 16px 24px}
.invite-sec button{width:100%;height:48px;border-radius:var(--r);font-size:16px;font-weight:600;background:var(--gold);color:#000;border:none;margin-top:10px}

/* User */
.u-header{padding:30px 16px 20px;display:flex;align-items:center;gap:16px}
.u-avatar{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;flex-shrink:0}
.u-avatar img{width:100%;height:100%;object-fit:cover}
.u-name{font-size:18px;font-weight:700}
.u-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;background:linear-gradient(90deg,var(--gold),#a8893a);color:#000;margin-top:4px;font-weight:600}
.u-login-btn{margin-top:6px;padding:6px 20px;border-radius:14px;background:var(--gold);color:#000;font-size:13px;font-weight:600;border:none}
.info-card{margin:0 16px 14px;padding:16px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.info-row .lbl{color:var(--t2)}
.asset-card{margin:0 16px 14px;padding:16px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r)}
.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;margin-bottom:12px}
.asset-val{font-size:20px;font-weight:700;color:var(--gold)}
.asset-lbl{font-size:12px;color:var(--t2);margin-top:2px}
.asset-btn{width:100%;padding:8px;border-radius:var(--r);background:var(--gold);color:#000;font-weight:600;border:none;font-size:14px}
.order-tabs{margin:0 16px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.order-tab{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 0;text-align:center;cursor:pointer;transition:.2s}
.order-tab:hover{border-color:var(--gold)}
.order-tab .oi{font-size:22px;margin-bottom:4px}
.order-tab .ot{font-size:12px;color:var(--t2)}
.func-list{margin:0 16px 24px}
.func-item{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:.2s}
.func-item:hover{border-color:var(--gold)}
.func-left{display:flex;align-items:center;gap:12px;font-size:14px}
.func-left .fi{font-size:18px}
.func-arrow{color:var(--t2)}

/* Checkin */
.ck-header{padding:20px 16px;text-align:center}
.ck-num{font-size:36px;font-weight:700;color:var(--gold)}
.ck-lbl{font-size:13px;color:var(--t2);margin-top:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 16px;margin-bottom:20px}
.cal-hdr{text-align:center;font-size:12px;color:var(--t2);padding:6px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--r);font-size:13px;color:var(--t3);background:var(--card);border:1px solid var(--bd)}
.cal-day.today{border-color:var(--gold);color:var(--gold);font-weight:700}
.cal-day.checked{background:var(--gold);color:#000;font-weight:700;border-color:var(--gold);animation:gp 2s infinite}
.cal-day.empty{background:transparent;border:none}
.cal-day.future{opacity:.4}
@keyframes gp{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.4)}50%{box-shadow:0 0 12px 4px rgba(201,168,76,.25)}}
.ck-btn{margin:0 16px 24px}
.ck-btn button{width:100%;height:50px;font-size:17px;border-radius:var(--r);font-weight:700;background:var(--gold);color:#000;border:none}
.ck-btn button:disabled{background:var(--bd);color:var(--t2)}

/* Cart Drawer */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000}
.cart-panel{position:fixed;top:0;right:0;bottom:0;width:85%;max-width:400px;background:var(--bg);z-index:1001;display:flex;flex-direction:column;border-left:1px solid var(--bd)}
.cart-header{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.cart-header h3{font-size:16px}
.cart-close{background:none;color:var(--t2);font-size:24px;cursor:pointer;border:none}
.cart-body{flex:1;overflow-y:auto;padding-bottom:140px}
.ci{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd)}
.ci-img{width:80px;height:80px;border-radius:6px;overflow:hidden;flex-shrink:0;background:#222}
.ci-img img{width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.ci-name{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci-price{color:var(--gold);font-weight:700;font-size:15px}
.ci-acts{display:flex;align-items:center;gap:8px}
.ci-acts button{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.ci-qty{font-size:14px;min-width:20px;text-align:center}
.ci-del{color:#ff4d4f;cursor:pointer;font-size:13px;margin-left:8px}
.cart-footer{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;background:var(--bg2);border-top:1px solid var(--bd)}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px}
.cart-total .amt{color:var(--gold);font-size:22px;font-weight:700}
.cart-checkout{width:100%;height:46px;border-radius:var(--r);font-size:16px;font-weight:600;background:var(--gold);color:#000;border:none}
.cart-empty{text-align:center;padding:60px 20px;color:var(--t2)}
.cart-empty .ce-icon{font-size:48px;opacity:.3;margin-bottom:12px}

/* Login */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.login-panel{background:var(--bg);border:1px solid var(--bd);border-radius:12px;max-width:400px;width:100%;padding:0}
.login-header{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.login-header h3{font-size:16px}
.login-close{background:none;color:var(--t2);font-size:20px;cursor:pointer;border:none}
.login-body{padding:24px 20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--t2);margin-bottom:6px}
.form-group input{width:100%;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);color:#fff;font-size:14px;outline:none}
.form-group input:focus{border-color:var(--gold)}
.code-row{display:flex;gap:10px}
.code-row input{flex:1}
.code-btn{padding:10px 16px;background:var(--gold);color:#000;border:none;border-radius:var(--r);font-size:13px;font-weight:600;white-space:nowrap;min-width:100px}
.code-btn:disabled{background:var(--bd);color:var(--t2)}
.login-submit{width:100%;height:44px;border-radius:var(--r);font-size:16px;font-weight:600;background:var(--gold);color:#000;border:none;margin-top:8px}
.switch-link{text-align:center;margin-top:16px;font-size:13px;color:var(--t4)}
.switch-link a{color:var(--gold);cursor:pointer;margin-left:4px}

.page-title{padding:16px;font-size:20px;font-weight:700;background:linear-gradient(180deg,rgba(201,168,76,.08),transparent);text-align:center;letter-spacing:1px}
.lang-toggle{position:fixed;top:10px;right:10px;z-index:1001;padding:4px 10px;border-radius:14px;background:var(--card);border:1px solid var(--bd);color:var(--t2);font-size:12px;cursor:pointer;transition:.2s}
.lang-toggle:hover{border-color:var(--gold);color:var(--gold)}
  </style>
</head>

  variants:[{prices:[{amount:[9880000,15280000,8560000,12980000,28860000,10280000,19560000,13880000][i],currency_code:'cny'}]}]
}));

function fmtPrice(p) {
  try {
    const v = p.variants;
    if (v && v[0]) {
      if (v[0].prices && v[0].prices[0]) return (v[0].prices[0].amount / 100).toLocaleString('en');
      if (v[0].calculated_price && v[0].calculated_price.calculated_amount)
        return (v[0].calculated_price.calculated_amount / 100).toLocaleString('en');
    }
  } catch(e) {}
  return '0';
}

// ===== Toast =====
function toast(msg) {
  const d = document.createElement('div');
  d.textContent = msg;
  Object.assign(d.style, {position:'fixed',top:'40%',left:'50%',transform:'translateX(-50%)',background:'rgba(0,0,0,.85)',color:'#fff',padding:'10px 24px',borderRadius:'8px',fontSize:'14px',zIndex:'9999',transition:'opacity .3s'});
  document.body.appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 300); }, 2000);
}

const HomePage = defineComponent({
  name: 'HomePage',
  setup() {
    const t = inject('t');
    const openDetail = inject('openDetail');
    const router = useRouter();
    const search = ref('');
    const products = ref([]);
    const loading = ref(true);
    const loadingMore = ref(false);
    const offset = ref(0);
    const hasMore = ref(true);
    const favs = ref(JSON.parse(localStorage.getItem('rolex_favs') || '[]'));
    const bannerIdx = ref(0);
    let bannerTimer = null;

    const displayed = computed(() => {
      if (!search.value) return products.value;
      const q = search.value.toLowerCase();
      return products.value.filter(p => p.title.toLowerCase().includes(q));
    });

    async function fetchProducts(append) {
      if (append) loadingMore.value = true; else loading.value = true;
      try {
        const r = await fetch(`${API}/products?limit=10&offset=${offset.value}&region_id=${RGN}`, { headers: HDRS });
        if (!r.ok) throw new Error('err');
        const d = await r.json();
        const items = d.products || [];
        products.value = append ? [...products.value, ...items] : items;
        hasMore.value = items.length >= 10;
        offset.value += items.length;
      } catch(e) {
        if (!append) products.value = MOCK;
        hasMore.value = false;
      } finally { loading.value = false; loadingMore.value = false; }
    }

    function isFav(id) { return favs.value.includes(id); }
    function toggleFav(id) {
      const i = favs.value.indexOf(id);
      if (i > -1) favs.value.splice(i,1); else favs.value.push(id);
      localStorage.setItem('rolex_favs', JSON.stringify(favs.value));
    }
    function goQuick(k) {
      if (k === 'checkin') router.push('/checkin');
      else if (k === 'vipCenter') router.push('/vip');
      else router.push('/user');
    }
    function nextBanner() { bannerIdx.value = (bannerIdx.value + 1) % BANNERS.length; }
    function prevBanner() { bannerIdx.value = (bannerIdx.value - 1 + BANNERS.length) % BANNERS.length; }

    onMounted(() => {
      fetchProducts(false);
      bannerTimer = setInterval(nextBanner, 4000);
    });

    return { t, search, displayed, loading, loadingMore, hasMore, favs, bannerIdx, BANNERS,
             fetchProducts, isFav, toggleFav, goQuick, openDetail, fmtPrice, nextBanner, prevBanner };
  },

    <div v-else class="product-grid">

        <div class="thumb">
          <img :src="p.thumbnail||'https://placehold.co/300x300/1a1b1e/c9a84c?text=R'" :alt="p.title" loading="lazy">

  </div>`

const CheckinPage = defineComponent({
  name: 'CheckinPage',
  setup() {
    const t = inject('t');
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth(), td = now.getDate();
    const dim = new Date(y, m+1, 0).getDate();
    const fd = new Date(y, m, 1).getDay();
    const days = [];
    for (let i = 0; i < fd; i++) days.push(0);
    for (let i = 1; i <= dim; i++) days.push(i);
    const calDays = ref(days);
    const checked = ref(JSON.parse(localStorage.getItem('ck_'+y+'_'+m) || '[]'));
    const todayDone = computed(() => checked.value.includes(td));
    const streak = computed(() => { let c=0; for(let d=td;d>=1;d--){if(checked.value.includes(d))c++;else break;} return c; });
    const hdrs = computed(() => [t('sun'),t('mon'),t('tue'),t('wed'),t('thu'),t('fri'),t('sat')]);
    function isC(d) { return checked.value.includes(d); }
    function doCheck() {
      if (todayDone.value) { toast(t('alreadyDone')); return; }
      checked.value.push(td);
      localStorage.setItem('ck_'+y+'_'+m, JSON.stringify(checked.value));
      toast(t('checkinOk'));
    }
    return { t, calDays, td, todayDone, streak, hdrs, isC, doCheck };
  },
  template: `<div>
    <div class="page-title">{{t('checkinTitle')}}</div>
    <div class="ck-header"><div class="ck-num">{{streak}}</div><div class="ck-lbl">{{t('consecutiveDays')}}</div></div>
    <div class="cal-grid">
      <div class="cal-hdr" v-for="h in hdrs" :key="h">{{h}}</div>
      <div v-for="(d,i) in calDays" :key="i" class="cal-day" :class="{empty:d===0,checked:d>0&&isC(d),today:d===td,future:d>td}">{{d>0?d:''}}</div>
    </div>
    <div class="ck-btn"><button :disabled="todayDone" @click="doCheck">{{todayDone?t('checkedIn'):t('checkinBtn')}}</button></div>
  </div>`
});

const app = createApp({
  setup() {
    const lang = ref(localStorage.getItem('rlang') || 'zh');
    const route = useRoute();
    const curTab = computed(() => route.path);
    const tabs = [{p:'/home',i:'🏠',l:'home'},{p:'/recycle',i:'♻️',l:'recycle'},{p:'/vip',i:'👑',l:'vip'},{p:'/user',i:'👤',l:'user'}];

    function t(k) { return msgs[lang.value][k] || k; }
    function toggleLang() { lang.value = lang.value==='zh'?'en':'zh'; localStorage.setItem('rlang',lang.value); }

    // Cart
    const cart = ref(JSON.parse(localStorage.getItem('rcart') || '[]'));
    const cartOpen = ref(false);
    const cartTotal = computed(() => cart.value.reduce((s,c) => s + parseFloat(String(c.dp).replace(/,/g,''))*c.qty, 0).toLocaleString('en'));
    function saveCart() { localStorage.setItem('rcart', JSON.stringify(cart.value)); }
    function addToCart(p) {
      const dp = fmtPrice(p);
      const ex = cart.value.find(c => c.id === p.id);
      if (ex) ex.qty++; else cart.value.push({id:p.id,title:p.title,thumb:p.thumbnail,dp,qty:1});
      saveCart(); toast(t('added'));
    }
    function chgQty(i,d) { cart.value[i].qty+=d; if(cart.value[i].qty<=0) cart.value.splice(i,1); saveCart(); }
    function rmCart(i) { cart.value.splice(i,1); saveCart(); }

    // Detail
    const detailOpen = ref(false);
    const detailP = ref(null);
    const selSize = ref('41mm');
    const sizes = ['36mm','39mm','41mm','44mm'];
    function openDetail(p) { detailP.value=p; detailOpen.value=true; selSize.value='41mm'; }

    const codeCd = ref(0);

    const userName = ref(localStorage.getItem('ruser')||'');

    function sendCode() {
      if(!lf.phone){toast(t('phonePh'));return;}
      codeCd.value=60;
      const tm=setInterval(()=>{codeCd.value--;if(codeCd.value<=0)clearInterval(tm);},1000);
      toast(t('codeSent'));

      if(!lf.phone){toast(t('phonePh'));return;}
      if(loginMode.value==='forgot'){toast(t('resetPwd'));loginOpen.value=false;return;}
      localStorage.setItem('ruser',lf.phone);
      isLogged.value=true; userName.value=lf.phone; loginOpen.value=false;
      toast(loginMode.value==='login'?t('loginOk'):t('regOk'));
    }

    // Provide
    provide('t', t);
    provide('openDetail', openDetail);
    provide('showLogin', showLogin);
    provide('isLogged', isLogged);
    provide('userName', userName);

    return { lang,curTab,tabs,t,toggleLang,
      cart,cartOpen,cartTotal,addToCart,chgQty,rmCart,saveCart,

    <!-- Login -->
    <div v-if="loginOpen" class="login-overlay" @click.self="loginOpen=false">
      <div class="login-panel">
        <div class="login-header">
          <h3>{{loginMode==='login'?t('login'):loginMode==='register'?t('register'):t('forgotPwd')}}</h3>
          <button class="login-close" @click="loginOpen=false">✕</button>
        </div>
        <div class="login-body">
          <div class="form-group"><label>{{t('phone')}}</label><input v-model="lf.phone" :placeholder="t('phonePh')"></div>
          <div class="form-group" v-if="loginMode!=='forgot'"><label>{{t('password')}}</label><input v-model="lf.pwd" type="password" :placeholder="t('pwdPh')"></div>
          <div class="form-group"><label>{{t('smsCode')}}</label>
            <div class="code-row"><input v-model="lf.code" :placeholder="t('codePh')">
              <button class="code-btn" :disabled="codeCd>0" @click="sendCode">{{codeCd>0?codeCd+'s':t('getCode')}}</button>
            </div>
          </div>
          <button class="login-submit" @click="doLogin">{{loginMode==='login'?t('login'):loginMode==='register'?t('register'):t('resetPwd')}}</button>
          <div class="switch-link" v-if="loginMode==='login'">
            {{t('noAccount')}}<a @click="loginMode='register'">{{t('register')}}</a>
            <span style="margin:0 8px">|</span><a @click="loginMode='forgot'">{{t('forgotPwd')}}</a>
          </div>
          <div class="switch-link" v-else>{{t('hasAccount')}}<a @click="loginMode='login'">{{t('login')}}</a></div>
        </div>
      </div>
    </div>
  </div>`
});

app.use(router);
app.mount('#app');
</script>
</body>
</html>
